name: CI/CD Pull Request

permissions:
  contents: read
  actions: read
  pull-requests: write

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy-ppe:
    if: contains(github.event.pull_request.labels.*.name, 'deploy-ppe')
    needs: [lint, typecheck, unit-tests, build]
    runs-on: ubuntu-latest
    environment: ppe
    timeout-minutes: 15
    concurrency:
      group: deploy-ppe
      cancel-in-progress: true
    env:
      DEPLOY_ENVIRONMENT: ppe
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
      WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
      OIDC_ISSUER_URL: ${{ vars.OIDC_ISSUER_URL }}
      TELEMETRY_GATEWAY_ORIGIN: ${{ vars.TELEMETRY_GATEWAY_ORIGIN }}
      OIDC_SIGNING_KID: ${{ vars.OIDC_SIGNING_KID }}
      OIDC_PUBLIC_JWK: ${{ vars.OIDC_PUBLIC_JWK }}
      GCP_WORKLOAD_PROVIDER: ${{ vars.GCP_WORKLOAD_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_APP_CLIENT_ID: ${{ vars.AZURE_APP_CLIENT_ID }}
      OTLP_TRACES_ENDPOINT: ${{ vars.OTLP_TRACES_ENDPOINT }}
      OTLP_METRICS_ENDPOINT: ${{ vars.OTLP_METRICS_ENDPOINT }}
      OTLP_LOGS_ENDPOINT: ${{ vars.OTLP_LOGS_ENDPOINT }}
      MIRROR_CHANNEL_IDS: ${{ vars.MIRROR_CHANNEL_IDS }}
      ENABLE_SCHEDULES: "false"
      OIDC_SIGNING_KEY: ${{ secrets.OIDC_SIGNING_KEY }}
      FIRECRAWL_API_TOKEN: ${{ secrets.FIRECRAWL_API_TOKEN }}
      ATPROTO_PASSWORD_UC5NO8MgTQKHAWXp6z8Xl7yQ: ${{ secrets.ATPROTO_PASSWORD_UC5NO8MgTQKHAWXp6z8Xl7yQ }}
      ATPROTO_PASSWORD_UC5NO8MgTQKHAWXp6z8Xl7yQ_RT: ${{ secrets.ATPROTO_PASSWORD_UC5NO8MgTQKHAWXp6z8Xl7yQ_RT }}
      GATEWAY_INGEST_BEARER: ${{ secrets.GATEWAY_INGEST_BEARER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Deploy cronless PPE from this pull request
        run: npm run deploy:ppe
